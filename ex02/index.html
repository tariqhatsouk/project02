
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CSS Shapes</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>CSS Shapes</h1>

    <p>Creating shapes using pure CSS.</p>

    <main class="shapes-container">

        <section class="shape-item">
            <h2>Square</h2>
            <div class="square"></div>
        </section>

        <section class="shape-item">
            <h2>Rectangle</h2>
            <div class="rectangle"></div>
        </section>

        <section class="shape-item">
            <h2>Circle</h2>
            <div class="circle"></div>
        </section>

        <section class="shape-item">
            <h2>Capsule</h2>
            <div class="capsule"></div>
        </section>

        <section class="shape-item">
            <h2>Triangle</h2>
            <div class="triangle"></div>
        </section>

    </main>

</body>
</html>
