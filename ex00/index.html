
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flexbox Layout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="home">
        <nav class="nav-container">

            <h1>Code Academy</h1>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#topics">Courses</a>
                <a href="#contact">Contact</a>
            </div>

        </nav>
    </header>

    <main>

        <h2>Our Courses</h2>

        <section id="topics" class="card-container">

            <article class="card">
                <h3>HTML</h3>
                <p>Learn how to structure web pages.</p>
            </article>

            <article class="card">
                <h3>CSS</h3>
                <p>Learn how to design websites.</p>
            </article>

            <article class="card">
                <h3>JavaScript</h3>
                <p>Learn how to make websites interactive.</p>
            </article>

            <article class="card">
                <h3>Cybersecurity</h3>
                <p>Learn the basics of web security.</p>
            </article>

        </section>

    </main>

    <footer id="contact">
        <p>Contact: student@example.com</p>
    </footer>

</body>
</html>
